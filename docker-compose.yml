services:
  mongodb:
    image: mongo:7.0
    container_name: fleet_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    volumes:
      - fleet_mongo_data:/data/db

volumes:
  fleet_mongo_data:
