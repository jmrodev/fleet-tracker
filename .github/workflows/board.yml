name: Deploy Project Board

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-board:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Daily Board
        uses: actions/checkout@v4
        with:
          repository: jmrodev/daily-board
          ref: gh-pages
          path: ./board-site

      - name: Force Tracker Context (No Daily pollution)
        run: |
          # Inyectar explícitamente jmrodev/fleet-tracker para evitar que tome ningún otro repo o fallback
          sed -i 's|detectCurrentRepoSlug()|"jmrodev/fleet-tracker"|g' ./board-site/js/state.js
          sed -i 's|detectRepoFromLocation()|"jmrodev/fleet-tracker"|g' ./board-site/js/state.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./board-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
