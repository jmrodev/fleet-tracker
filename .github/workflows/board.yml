name: Deploy Project Board

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-board:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Daily Board
        uses: actions/checkout@v4
        with:
          repository: jmrodev/daily-board
          ref: gh-pages
          path: ./board-site

      - name: Force Tracker Context (Clean Syntax)
        run: |
          # Reemplazar la resolución del slug de forma limpia y sintácticamente válida
          python3 -c "
          with open('./board-site/js/state.js', 'r') as f:
              content = f.read()
          
          # Forzar detectedSlug directamente sin romper definiciones de funciones
          content = content.replace('const detectedSlug = detectCurrentRepoSlug();', 'const detectedSlug = \"jmrodev/fleet-tracker\";')
          
          with open('./board-site/js/state.js', 'w') as f:
              f.write(content)
          "
          # Validar sintaxis con Node.js en el runner
          node -c ./board-site/js/state.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./board-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
